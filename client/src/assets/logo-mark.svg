<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 84" width="100" height="84" role="img" aria-label="AgentLab logo">
  <!-- Source of truth for the sidebar mark. client/src/LogoMark.jsx inlines
       the same shapes (with a namespaced gradient id); keep the two in sync. -->
  <defs>
    <linearGradient id="logo-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="84">
      <stop offset="0" style="stop-color: var(--logo-grad-start, #7B818B)" />
      <stop offset="1" style="stop-color: var(--logo-grad-end, #2B2F36)" />
    </linearGradient>
  </defs>
  <path d="M12.5 71.5 L50 12.5 L87.5 71.5" fill="none" stroke="url(#logo-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M12.5 71.5 C25 62 38 59 50 59 C62 59 75 62 87.5 71.5" fill="none" stroke="url(#logo-grad)" stroke-width="5" stroke-linecap="round" />
  <g fill="url(#logo-grad)">
    <circle cx="50" cy="12.5" r="12.5" />
    <circle cx="12.5" cy="71.5" r="12.5" />
    <circle cx="87.5" cy="71.5" r="12.5" />
    <circle cx="50" cy="59" r="9.5" fill-opacity="0.85" />
  </g>
</svg>
