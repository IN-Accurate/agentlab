name: CD

# Publishes the API image after CI passes on main. Set the DEPLOY_HOOK_URL
# secret to a host's deploy webhook to also trigger a release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      # Older or rerun commits must not replace latest.
      - name: Check main tip
        id: tip
        shell: bash
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" = "$SHA" ]; then current=true; else current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.tip.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.tip.outputs.current == 'true'
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/api"
          docker build -t "$image:$SHA" -t "$image:latest" server
          docker push --all-tags "$image"
      - name: Trigger deploy
        if: steps.tip.outputs.current == 'true' && env.DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --proto '=https' --max-time 30 -X POST "$DEPLOY_HOOK_URL"
